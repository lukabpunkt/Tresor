name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Qualitaets-Gate (Standing Audit)
        run: |
          npm run typecheck
          npm run lint -- --max-warnings 5
          npm run test:unit

      - name: Build (base = /Tresor/)
        run: npm run build

      - uses: actions/configure-pages@v6
        with:
          # Aktiviert Pages beim ersten Lauf selbst, statt einen manuellen Klick zu verlangen.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
