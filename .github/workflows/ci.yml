name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (max. 5 Warnings, Standing Audit)
        run: npm run lint -- --max-warnings 5

      - name: Kontrast (Audit A5)
        # WCAG AA fuer jede Text/Flaechen-Paarung im CSS — laeuft ohne Browser und
        # deshalb in jedem CI-Lauf, nicht nur einmalig in Lighthouse.
        run: npm run check:contrast

      - name: Farb-Audit (Audit A2)
        run: npm run check:colors

      - name: Unit-Tests mit Coverage
        # Die Schwellen stehen in vitest.config.ts: core/ >= 95 %, fsm.ts = 100 %.
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle-Groesse melden (Standing Audit)
        run: |
          echo "### Bundle (gzip)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -name '*.js' -print0 | while IFS= read -r -d '' file; do
            printf '%-48s %6s KB\n' "$(basename "$file")" "$(gzip -c "$file" | wc -c | awk '{printf "%.1f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
          done
          total=$(find dist/assets -name '*.js' -exec cat {} + | gzip -c | wc -c)
          printf '%-48s %6s KB\n' "GESAMT JS" "$(awk -v b="$total" 'BEGIN{printf "%.1f", b/1024}')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle-Budget durchsetzen (Architektur §1, Audit A5)
        # Das Skript summiert die statische Import-Kette ab index.html und faellt um,
        # wenn ein Buehnen-Chunk zurueck in den Einstieg gerutscht ist (ADR-28).
        run: npm run check:bundle

      - name: Coverage-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Mobile-Emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright-Browser installieren
        # iPhone 12 laeuft in Playwright unter WebKit (Safari-Referenz), Pixel 5 unter Chromium.
        run: npx playwright install --with-deps chromium webkit

      - name: E2E-Flow
        run: npm run test:e2e

      - name: Performance
        # Ab M3 misst dieser Lauf die Reveal-Show; bis dahin uebersprungener Platzhalter.
        run: npm run test:perf -- --project="Pixel 5"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
